name: Prepare Mac release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Package
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appscope-release-candidate
          path: |
            dist/*.tar.gz
            dist/*.sha256
# This workflow creates an unsigned release candidate only. Developer ID signing,
# notarization, public release upload and tap updates are explicit maintainer steps.
# Never commit signing identities' private keys, certificates, or Apple credentials.
